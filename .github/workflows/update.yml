name: Update philosophy widget

on:
  schedule:
    - cron: '0 20 * * *'  # 04:00 Asia/Shanghai
    - cron: '0 10 * * *'  # 18:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: philosophy-widget-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate philosophy quote
        env:
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          JIEKOU_MODEL: gpt-4.1-mini
        run: python generate.py
      - name: Commit updated JSON and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-philosophy.json quote-history.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update daily philosophy quote'
            git pull --rebase origin main
            git push
          fi
