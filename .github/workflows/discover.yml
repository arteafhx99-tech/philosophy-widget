name: Discover philosophy quotes

on:
  schedule:
    - cron: '30 16 * * *' # 00:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: philosophy-widget-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover and verify quotes
        env:
          JIEKOU_API_KEY: ${{ secrets.JIEKOU_API_KEY }}
          JIEKOU_MODEL: gpt-4.1-mini
        run: python discover.py
      - name: Commit quote databases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quotes.json pending-quotes.json
          if git diff --cached --quiet; then
            echo 'No new quotes to commit.'
          else
            git commit -m 'Discover verified philosophy quotes'
            git pull --rebase origin main
            git push
          fi
